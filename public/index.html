<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Meeting Agent</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #07111f; color: #eaf2f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    .card { padding: 36px; border: 1px solid #29455f; border-radius: 24px; background: #0d1d2c; }
    .eyebrow { color: #72e2d1; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
    h1 { margin: 8px 0; font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 1; }
    h2 { margin-top: 0; }
    form { display: grid; gap: 16px; margin-top: 28px; }
    label { display: grid; gap: 8px; font-weight: 700; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #35546d; border-radius: 10px; background: #07111f; color: inherit; font: inherit; }
    button { padding: 12px 16px; border: 1px solid #4f7694; border-radius: 10px; background: #17344c; color: inherit; font: inherit; font-weight: 800; cursor: pointer; }
    button.primary { border-color: #72e2d1; background: #126b65; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .error { margin-top: 16px; padding: 12px; border: 1px solid #bd6068; border-radius: 10px; color: #ffb6bd; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 28px; }
    .metric { padding: 22px; min-height: 120px; border: 1px solid #29455f; border-radius: 16px; background: #0b1927; }
    .metric strong { display: block; color: #72e2d1; font-size: 1.8rem; margin-bottom: 8px; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) { .actions, .metrics { grid-template-columns: 1fr; } .toolbar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <section id="login" class="card">
    <p class="eyebrow">Consent-aware operations</p>
    <h1>AI Meeting Agent</h1>
    <p>Sign in to the local meeting operations workspace.</p>
    <div id="login-error" class="error" role="alert" hidden></div>
    <form id="login-form">
      <label>Email<input id="email" name="email" type="email" autocomplete="username" required placeholder="Enter your email" /></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password" /></label>
      <div class="actions">
        <button id="autofill" type="button">Auto Fill Demo Credentials</button>
        <button class="primary" type="submit">Sign In</button>
      </div>
    </form>
  </section>
  <section id="dashboard" class="card" hidden>
    <div class="toolbar">
      <div><p class="eyebrow">Authenticated workspace</p><h2>Meeting Operations Dashboard</h2><p id="welcome"></p></div>
      <button id="sign-out" type="button">Sign Out</button>
    </div>
    <div class="metrics">
      <article class="metric"><strong>01</strong>Confirm participants and consent</article>
      <article class="metric"><strong>02</strong>Connect an authorized transcript source</article>
      <article class="metric"><strong>03</strong>Review actions before publishing</article>
    </div>
  </section>
</main>
<script>
  const loginView = document.getElementById('login');
  const dashboard = document.getElementById('dashboard');
  const form = document.getElementById('login-form');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const errorView = document.getElementById('login-error');
  function showDashboard(user) {
    loginView.hidden = true;
    dashboard.hidden = false;
    document.getElementById('welcome').textContent = `Signed in as ${user.name}.`;
  }
  document.getElementById('autofill').addEventListener('click', async () => {
    errorView.hidden = true;
    try {
      const response = await fetch('/api/auth/demo-credentials');
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Demo credentials are unavailable');
      email.value = data.email;
      password.value = data.password;
      email.dispatchEvent(new Event('input', { bubbles: true }));
      password.dispatchEvent(new Event('input', { bubbles: true }));
    } catch (error) {
      errorView.textContent = error.message;
      errorView.hidden = false;
    }
  });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorView.hidden = true;
    try {
      const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email.value, password: password.value }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Sign in failed');
      sessionStorage.setItem('meeting-session', data.token);
      showDashboard(data.user);
    } catch (error) {
      errorView.textContent = error.message;
      errorView.hidden = false;
    }
  });
  document.getElementById('sign-out').addEventListener('click', () => {
    sessionStorage.removeItem('meeting-session');
    dashboard.hidden = true;
    loginView.hidden = false;
    form.reset();
  });
  (async () => {
    const token = sessionStorage.getItem('meeting-session');
    if (!token) return;
    const response = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } });
    if (!response.ok) return sessionStorage.removeItem('meeting-session');
    const data = await response.json();
    showDashboard(data.user);
  })();
</script>
</body>
</html>
